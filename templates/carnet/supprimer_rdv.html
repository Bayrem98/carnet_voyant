{% extends 'base.html' %}
{% block title %}Supprimer le RDV{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto animate-fade-in-up">
    <div class="glass rounded-3xl p-8 text-center">
        <div class="w-20 h-20 mx-auto mb-6 rounded-full bg-red-100 flex items-center justify-center animate-float">
            <i data-lucide="alert-triangle" class="w-10 h-10 text-red-500"></i>
        </div>

        <h1 class="text-2xl font-bold text-slate-800 mb-3">Supprimer ce rendez-vous ?</h1>
        <p class="text-slate-600 mb-6">
            Le RDV du <strong>{{ rdv.date_rdv|date:"d/m/Y" }}</strong> à
            <strong>{{ rdv.heure_rdv|time:"H:i" }}</strong>
            pour <strong>{{ fiche.nom_complet }}</strong> sera définitivement supprimé.
        </p>

        <form method="post" class="flex items-center justify-center gap-3">
            {% csrf_token %}
            <a href="{% url 'carnet:detail_fiche' fiche.pk %}" class="btn btn-ghost">Annuler</a>
            <button type="submit" class="btn bg-red-500 text-white hover:bg-red-600">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
                Oui, supprimer
            </button>
        </form>
    </div>
</div>
{% endblock %}
