{% extends 'base.html' %}
{% block title %}Modifier le RDV{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto animate-fade-in-up">
    <div class="mb-6">
        <a href="{% url 'carnet:detail_fiche' fiche.pk %}"
           class="text-sm text-slate-500 hover:text-purple-600 flex items-center gap-1 mb-3">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            Retour à la fiche
        </a>
        <h1 class="text-3xl font-bold text-purple-900">Modifier le rendez-vous</h1>
        <p class="text-slate-500">{{ fiche.nom_complet }}</p>
    </div>

    <form method="post" class="glass rounded-3xl p-6 space-y-4">
        {% csrf_token %}

        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">Date</label>
                {{ form.date_rdv }}
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">Heure</label>
                {{ form.heure_rdv }}
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">Statut</label>
                {{ form.statut }}
            </div>
        </div>

        <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Sujet prévu</label>
            {{ form.sujet_prevu }}
        </div>

        <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-200">
            <a href="{% url 'carnet:detail_fiche' fiche.pk %}" class="btn btn-ghost">Annuler</a>
            <button type="submit" class="btn btn-primary">
                <i data-lucide="save" class="w-5 h-5"></i>
                Enregistrer
            </button>
        </div>
    </form>
</div>
{% endblock %}
