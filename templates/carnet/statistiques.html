{% extends 'base.html' %}
{% block title %}Statistiques{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto">
    <h1 class="text-3xl font-bold text-purple-900 mb-6 animate-fade-in-up">Mes statistiques</h1>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5 mb-8">
        <div class="glass rounded-2xl p-6 animate-fade-in-up">
            <div class="flex items-center justify-between mb-3">
                <i data-lucide="book" class="w-8 h-8 text-purple-500"></i>
                <span class="text-3xl font-bold text-purple-900">{{ total_fiches }}</span>
            </div>
            <p class="text-slate-600 text-sm">Fiches clients</p>
        </div>
        <div class="glass rounded-2xl p-6 animate-fade-in-up" style="animation-delay: 0.1s">
            <div class="flex items-center justify-between mb-3">
                <i data-lucide="history" class="w-8 h-8 text-pink-500"></i>
                <span class="text-3xl font-bold text-pink-900">{{ total_historiques }}</span>
            </div>
            <p class="text-slate-600 text-sm">Consultations enregistrées</p>
        </div>
        <div class="glass rounded-2xl p-6 animate-fade-in-up" style="animation-delay: 0.2s">
            <div class="flex items-center justify-between mb-3">
                <i data-lucide="calendar-check" class="w-8 h-8 text-blue-500"></i>
                <span class="text-3xl font-bold text-blue-900">{{ total_rdv }}</span>
            </div>
            <p class="text-slate-600 text-sm">RDV planifiés</p>
        </div>
        <div class="glass rounded-2xl p-6 animate-fade-in-up" style="animation-delay: 0.3s">
            <div class="flex items-center justify-between mb-3">
                <i data-lucide="star" class="w-8 h-8 text-yellow-500"></i>
                <span class="text-3xl font-bold text-yellow-900">{{ fiches_favorites }}</span>
            </div>
            <p class="text-slate-600 text-sm">Clients favoris</p>
        </div>
    </div>
</div>
{% endblock %}
